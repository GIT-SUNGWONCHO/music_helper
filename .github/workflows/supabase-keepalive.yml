name: Supabase keep-alive

# Supabase 무료 플랜은 일정 기간(약 1주) 요청이 없으면 프로젝트를 자동 일시정지한다.
# 매일 한 번 가장 가벼운 쿼리를 보내 깨어 있는 상태로 유지한다.
on:
  schedule:
    - cron: '0 3 * * *' # 매일 12:00 KST (03:00 UTC)
  workflow_dispatch: # 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 설정되지 않았습니다."
            echo "GitHub repo > Settings > Secrets and variables > Actions 에서 추가하세요."
            exit 1
          fi
          base="${SUPABASE_URL%/}"
          # 키는 apikey 헤더로만 보낸다. 신형 publishable 키(sb_publishable_...)는 JWT가 아니라서
          # Authorization: Bearer 로 같이 보내면 JWT 파싱에 걸려 401이 난다. apikey만 쓰면 신·구 키 모두 통한다.
          body=$(mktemp)
          status=$(curl -s -o "${body}" -w '%{http_code}' \
            "${base}/rest/v1/songs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "HTTP ${status}"
          if [ "${status}" != "200" ]; then
            echo "Supabase가 200을 반환하지 않았습니다 — 프로젝트 일시정지 또는 URL/키 문제일 수 있습니다."
            # 원인 파악용 응답 본문(키는 포함되지 않음)
            echo "응답: $(head -c 300 "${body}")"
            exit 1
          fi
          echo "Supabase 정상 응답 — keep-alive 완료"
