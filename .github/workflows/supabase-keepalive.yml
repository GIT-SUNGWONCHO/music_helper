name: Supabase keep-alive

# Supabase 무료 플랜은 일정 기간(약 1주) 요청이 없으면 프로젝트를 자동 일시정지한다.
# 매일 한 번 가장 가벼운 쿼리를 보내 깨어 있는 상태로 유지한다.
on:
  schedule:
    - cron: '0 3 * * *' # 매일 12:00 KST (03:00 UTC)
  workflow_dispatch: # 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 설정되지 않았습니다."
            echo "GitHub repo > Settings > Secrets and variables > Actions 에서 추가하세요."
            exit 1
          fi
          base="${SUPABASE_URL%/}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "${base}/rest/v1/songs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${status}"
          if [ "${status}" != "200" ]; then
            echo "Supabase가 200을 반환하지 않았습니다 — 프로젝트가 일시정지됐거나 URL/키가 잘못됐을 수 있습니다."
            exit 1
          fi
          echo "Supabase 정상 응답 — keep-alive 완료"
